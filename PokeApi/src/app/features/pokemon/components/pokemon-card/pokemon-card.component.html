<div class="card">
  <div class="card__id">#{{ pokemon.id.toString().padStart(3, '0') }}</div>
  <img
    class="card__img"
    [src]="pokemon.sprites.other['official-artwork'].front_default"
    [alt]="pokemon.name"
  />
  <h3 class="card__name">{{ pokemon.name }}</h3>
  <div class="card__types">
    <span
      class="card__type"
      *ngFor="let t of pokemon.types"
      [ngClass]="'type--' + t.type.name">
      {{ t.type.name }}
    </span>
  </div>
  <div class="card__info">
    <div class="card__stat">
      <span class="label">Altura</span>
      <span class="value">{{ pokemon.height / 10 }} m</span>
    </div>
    <div class="card__stat">
      <span class="label">Peso</span>
      <span class="value">{{ pokemon.weight / 10 }} kg</span>
    </div>
    <div class="card__stat">
      <span class="label">Exp. base</span>
      <span class="value">{{ pokemon.base_experience }}</span>
    </div>
    <div class="card__stat">
      <span class="label">Habilidad</span>
      <span class="value">{{ pokemon.abilities[0].ability.name }}</span>
    </div>
  </div>
  <div class="card__stats">
    <div class="card__bar" *ngFor="let stat of pokemon.stats">
      <span class="bar__name">{{ stat.stat.name }}</span>
      <div class="bar__track">
        <div class="bar__fill" [style.width.%]="(stat.base_stat / 255) * 100"></div>
      </div>
      <span class="bar__value">{{ stat.base_stat }}</span>
    </div>
  </div>
</div>
